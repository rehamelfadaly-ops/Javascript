<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب</title>
</head>
<body>

    <h1>نظام إدارة وتحليل نتائج الطلاب</h1>
    <p>افتح Console لمشاهدة نتائج النظام.</p>

    <script>

        // 1. إنشاء Class Student
        class Student {

            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            // 2. حساب المتوسط باستخدام reduce
            calculateAverage() {

                const total = this.grades.reduce(
                    (sum, grade) => sum + grade, 0
                );

                return total / this.grades.length;
            }

            // 3. تحديد التقدير
            getGrade(average) {

                if (average >= 90) {
                    return "A";
                } else if (average >= 80) {
                    return "B";
                } else if (average >= 70) {
                    return "C";
                } else if (average >= 60) {
                    return "D";
                } else if (average >= 50) {
                    return "E";
                } else {
                    return "F";
                }
            }

            // 4. تحديد النتيجة النهائية
            getFinalResult() {

                const average = this.calculateAverage();

                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }


        // 5. إنشاء مصفوفة الطلاب
        const studentsList = [

            new Student(101, "Ahmed", [80, 90, 85], 95),

            new Student(102, "Mona", [45, 48, 42], 80),

            new Student(103, "Ali", [30, 40, 35], 90),

            new Student(104, "Sara", [60, 70, 65], 70)

        ];


        // 6. طباعة تقرير جميع الطلاب
        console.log("===== All Students Report =====");

        studentsList.forEach(student => {

            const average = student.calculateAverage();

            console.log({
                "ID": student.id,
                "Name": student.name,
                "Average": average.toFixed(2),
                "Grade": student.getGrade(average),
                "Result": student.getFinalResult()
            });

        });


        // 7. استخراج الطلاب المتعثرين باستخدام filter
        const weakStudents = studentsList.filter(student => {

            const average = student.calculateAverage();

            return average >= 40 && average <= 49;

        });


        // 8. إضافة 5 درجات رأفة باستخدام map
        const graceStudents = weakStudents.map(student => {

            return {
                id: student.id,
                name: student.name,
                oldAverage: student.calculateAverage(),
                newAverage: student.calculateAverage() + 5
            };

        });


        // 9. جمع المتوسطات الجديدة باستخدام reduce
        const totalNewAverages = graceStudents.reduce(
            (sum, student) => sum + student.newAverage, 0
        );


        // 10. حساب متوسط الرأفة مع الحماية من القسمة على صفر
        const graceAverage = graceStudents.length > 0
            ? totalNewAverages / graceStudents.length
            : 0;


        // 11. طباعة نتائج لجنة الرأفة
        console.log("===== Grace Committee =====");

        console.table(graceStudents);


        // 12. طباعة متوسط درجات المتعثرين بعد الرأفة
        console.log(
            "Grace Average:",
            graceAverage.toFixed(2)
        );

    </script>

</body>
</html>
